# Template for a SEPARATE private backup repository; do not install on the app's production branch.
name: Graucar development backup
on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *' # 03:30 America/Sao_Paulo / America/Belem
permissions:
  contents: read
concurrency:
  group: graucar-dev-backup
  cancel-in-progress: false
jobs:
  backup:
    if: vars.ENABLE_DEV_BACKUPS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: postgres:17.11-bookworm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install isolated Python dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 python3-venv ca-certificates
          python3 -m venv /tmp/backup-venv
          /tmp/backup-venv/bin/pip install --disable-pip-version-check -r requirements.txt
      - name: Run encrypted backup and remote integrity check
        env:
          GRAUCAR_BACKUP_ENABLED: 'true'
          GRAUCAR_DEV_DATABASE_URL: ${{ secrets.GRAUCAR_DEV_DATABASE_URL }}
          GRAUCAR_DEV_SERVICE_ROLE_KEY: ${{ secrets.GRAUCAR_DEV_SERVICE_ROLE_KEY }}
          GRAUCAR_BACKUP_ENCRYPTION_KEY: ${{ secrets.GRAUCAR_BACKUP_ENCRYPTION_KEY }}
          GRAUCAR_B2_KEY_ID: ${{ secrets.GRAUCAR_B2_KEY_ID }}
          GRAUCAR_B2_APPLICATION_KEY: ${{ secrets.GRAUCAR_B2_APPLICATION_KEY }}
          GRAUCAR_B2_BUCKET_ID: ${{ vars.GRAUCAR_B2_BUCKET_ID }}
          GRAUCAR_B2_BUCKET_NAME: ${{ vars.GRAUCAR_B2_BUCKET_NAME }}
        run: /tmp/backup-venv/bin/python backup.py
